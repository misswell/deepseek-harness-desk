<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>DeepSeek Harness Desk</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="harness-surface" aria-label="DeepSeek Harness">
        <div class="frame-container hidden" id="frame-container">
          <div class="frame-loading" id="frame-loading">正在加载 Harness 页面…</div>
          <iframe
            id="harness-frame"
            title="DeepSeek Harness Web UI"
            allow="clipboard-read; clipboard-write"
          ></iframe>
        </div>

        <section class="startup-view" id="startup-view" aria-live="polite">
          <div class="startup-card">
            <div class="brand-mark" aria-hidden="true">H</div>
            <div class="spinner" id="startup-spinner" aria-hidden="true"></div>
            <h1 id="startup-title">正在启动 DeepSeek Harness…</h1>
            <p id="startup-message">正在准备本机运行环境，请稍候。</p>
            <div class="startup-status">
              <div class="status-row">
                <span>Runtime</span>
                <strong id="runtime-status">检查中…</strong>
              </div>
              <div class="status-row">
                <span>Harness</span>
                <strong id="harness-status">启动中…</strong>
              </div>
              <div class="status-row">
                <span>Port</span>
                <strong id="port-status">—</strong>
              </div>
            </div>
            <div class="startup-actions">
              <button class="primary-button" id="start-button">重新启动</button>
              <button class="secondary-button" id="startup-logs-button">查看日志</button>
            </div>
          </div>
        </section>

        <section class="error-view hidden" id="error-view" aria-live="assertive">
          <div class="startup-card error-card">
            <div class="error-mark" aria-hidden="true">!</div>
            <h1>DeepSeek Harness 无法启动</h1>
            <p id="error-message">发生未知错误。</p>
            <div class="startup-actions">
              <button class="primary-button" id="retry-button">重新启动</button>
              <button class="secondary-button" id="error-logs-button">查看日志</button>
            </div>
          </div>
        </section>
      </section>

      <section class="panel hidden" id="logs-panel" aria-label="运行日志">
        <div class="panel-heading">
          <div>
            <span class="panel-kicker">PROCESS OUTPUT</span>
            <h2>运行日志</h2>
          </div>
          <div class="panel-actions">
            <button class="toolbar-button" id="clear-logs-button">清空</button>
            <button class="icon-button" id="close-logs-button" title="关闭日志">×</button>
          </div>
        </div>
        <div class="log-list" id="log-list"></div>
      </section>

      <section class="panel settings-panel hidden" id="settings-panel" aria-label="设置">
        <div class="panel-heading">
          <div>
            <span class="panel-kicker">PREFERENCES</span>
            <h2>设置</h2>
          </div>
          <button class="icon-button" id="close-settings-button" title="关闭设置">×</button>
        </div>
        <div class="settings-list">
          <label class="setting-row">
            <span>
              <strong>在 Dock 中显示图标</strong>
              <small>关闭后应用仍在运行，可从菜单栏图标唤醒窗口。</small>
            </span>
            <input type="checkbox" id="dock-icon-toggle" />
          </label>
          <div class="setting-row stacked">
            <span>
              <strong>内置运行时</strong>
              <small id="settings-runtime-path">检查中…</small>
              <small id="runtime-install-status">正在检查运行时…</small>
            </span>
            <div class="setting-actions">
              <button class="toolbar-button hidden" id="runtime-install-button">安装运行时</button>
              <button class="toolbar-button" id="refresh-runtime-button">重新检查</button>
            </div>
          </div>
          <p class="setting-note">
            首次启动会自动准备隔离的 Node.js 和 DeepSeek Harness，不依赖系统 Node.js 版本。
          </p>
        </div>
      </section>
    </main>

    <div class="toast hidden" id="toast" role="status"></div>
  </body>
</html>
