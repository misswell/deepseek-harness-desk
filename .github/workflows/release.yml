name: Release macOS app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Developer ID signing certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          : "${P12_BASE64:?APPLE_CERTIFICATE_P12 is required}"
          : "${P12_PASSWORD:?APPLE_CERTIFICATE_PASSWORD is required}"
          : "${APPLE_DEVELOPER_ID:?APPLE_DEVELOPER_ID is required}"
          keychain="$RUNNER_TEMP/deepseek-signing.keychain-db"
          p12="$RUNNER_TEMP/deepseek-developer-id.p12"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$P12_BASE64" | base64 -D > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain" /Library/Keychains/System.keychain
          security default-keychain -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_DEVELOPER_ID"

      - name: Archive Release build
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          xcodebuild archive \
            -project DeepSeekHarnessDesk.xcodeproj \
            -scheme DeepSeekHarnessDesk \
            -configuration Release \
            -archivePath build-release/DeepSeekHarnessDesk.xcarchive \
            -destination "generic/platform=macOS" \
            -derivedDataPath build-release/DerivedData \
            CODE_SIGN_IDENTITY="$APPLE_DEVELOPER_ID"

      - name: Export Developer ID app
        run: |
          xcodebuild -exportArchive \
            -archivePath build-release/DeepSeekHarnessDesk.xcarchive \
            -exportPath build-release/export \
            -exportOptionsPlist ExportOptions-DeveloperID.plist

      - name: Create notarization archive
        id: package
        run: |
          app="build-release/export/DeepSeek Harness Desk.app"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          zip="build-release/export/DeepSeekHarnessDesk-${version}-macOS-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "${{ steps.package.outputs.zip }}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "${{ steps.package.outputs.app }}"
          xcrun stapler validate "${{ steps.package.outputs.app }}"
          rm -f "${{ steps.package.outputs.zip }}"
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ steps.package.outputs.app }}" \
            "${{ steps.package.outputs.zip }}"

      - name: Verify notarized app
        run: |
          codesign --verify --deep --strict "${{ steps.package.outputs.app }}"
          spctl --assess --type execute --verbose=4 "${{ steps.package.outputs.app }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          --title "DeepSeek Harness Desk ${{ github.ref_name }}"
          --generate-notes
          "${{ steps.package.outputs.zip }}#DeepSeek Harness Desk for macOS"
