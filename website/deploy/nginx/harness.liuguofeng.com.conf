# DeepSeek Harness Desk static site.
# Keep the ACME challenge on the shared webroot so acme.sh can renew this
# subdomain without taking the site offline.
server {
    listen 80;
    listen [::]:80;
    server_name harness.liuguofeng.com;

    location ^~ /.well-known/acme-challenge/ {
        root /home/wwwroot/default;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name harness.liuguofeng.com;

    root /home/wwwroot/harness.liuguofeng.com;
    index index.html;

    ssl_certificate /usr/local/nginx/conf/ssl/harness.liuguofeng.com/fullchain.cer;
    ssl_certificate_key /usr/local/nginx/conf/ssl/harness.liuguofeng.com/harness.liuguofeng.com.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:HarnessDeskSSL:10m;

    location ^~ /.well-known/acme-challenge/ {
        root /home/wwwroot/default;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
